<!doctype html><html lang="bs"><head><script async src="https://www.googletagmanager.com/gtag/js?id=G-4WRS80K94M"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag("js",new Date());gtag("config","G-4WRS80K94M");</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nova hidžretska godina – mektebska lekcija</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101d30;color:#f7f8ff;font:16px system-ui,Arial,sans-serif}header{padding:20px 12px;text-align:center;background:linear-gradient(120deg,#45416d,#346b6a);border-bottom:3px solid #e5c67c}h1{font-size:clamp(23px,5vw,34px);margin:0;color:#fff2c4}header p{margin:6px}main{max-width:780px;margin:auto;padding:12px}.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:10px 0}.tabs button{font-size:13px}.panel{background:#1c3040;border:1px solid #739d91;border-radius:17px;padding:16px;margin:12px 0;min-height:250px}button{border:1px solid #d5ba75;background:#285e57;color:white;border-radius:12px;padding:12px 10px;font-size:15px;font-weight:700;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45}button.on{background:#e4c16e;color:#142b2c}button.correct{background:#16864b!important}button.wrong{background:#a52e40!important}.answer{display:block;width:100%;text-align:left;margin:8px 0;min-height:48px}.card{background:#284e52;padding:15px;border-radius:13px;margin:10px 0;border:1px solid #508b85;line-height:1.55}.gold{color:#ffdf91}h2{font-size:22px;color:#ffe0a0}h3{color:#ffe4ae}.row{display:flex;gap:8px}.row button{flex:1}.progress{height:9px;background:#395062;border-radius:10px;overflow:hidden}.progress div{height:100%;width:0;background:#e5c16d;transition:width .2s}#score,#feedback{text-align:center;margin:9px 0;font-weight:700}#score{color:#ffdf91}#feedback{min-height:26px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:7px}.pair button{width:100%;min-height:60px;font-size:13px;margin:4px 0;overflow-wrap:anywhere}.picked{background:#c7a34d!important;color:#132c26}.done{background:#227c53!important;opacity:.6}.months{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.months span{padding:9px;background:#30695c;border-radius:8px;font-size:14px}.small{font-size:13px;color:#c5ded6}.hide{display:none}footer{text-align:center;color:#ffe0a0;padding:18px}@media(max-width:390px){button{font-size:13px}.tabs button{font-size:12px}.panel{padding:11px}} </style></head><body><header><h1>🌙 NOVA HIDŽRETSKA GODINA</h1><p>Interaktivna mektebska lekcija</p><small>Hidžra • Hidžretski kalendar • 12 mjeseci</small></header><main><div class="tabs" id="tabs"></div><div id="score">Bodovi: 0</div><div class="progress"><div id="bar"></div></div><section class="panel" id="view"></section><div id="feedback" aria-live="polite"></div></main><footer>Pripremio Abdo ef. Rekić</footer><script>
'use strict';
const months=['MUHARREM','SAFER','REBIUL-EVVEL','REBIUL-AHIR','DŽUMADEL-ULA','DŽUMADEL-UHRA','REDŽEB','ŠA’BAN','RAMAZAN','ŠEVAL','ZUL-KADE','ZUL-HIDŽE'];
const facts=[['Kako se zove muslimanska godina?','Hidžretska godina'],['Kojeg dana počinje nova hidžretska godina?','Prvog dana muharrema'],['Kako se zove prvi hidžretski mjesec?','Muharrem'],['Koliko mjeseci ima hidžretska godina?','Dvanaest'],['Šta je Hidžra?','Preseljenje Muhammeda, a.s., i muslimana iz Mekke u Medinu'],['Iz kojeg grada je izvršena Hidžra?','Iz Mekke'],['U koji grad je izvršena Hidžra?','U Medinu'],['Koje godine po gregorijanskom kalendaru se dogodila Hidžra?','622. godine'],['Po kojem događaju se računa hidžretski kalendar?','Po Hidžri'],['Kakva je hidžretska godina?','Lunarna (mjesečeva)'],['Koliko dana obično ima hidžretska godina?','354 ili 355 dana'],['Kada započinje dan u hidžretskom kalendaru?','Zalaskom Sunca'],['Kada se završava dan u hidžretskom kalendaru?','Sljedećim zalaskom Sunca'],['Kako čestitamo novu hidžretsku godinu?','Mubarek nova hidžretska godina!'],['Šta je muharrem u hidžretskom kalendaru?','Prvi mjesec'],['Koji je mjesec posta?','Ramazan'],['Koji je dvanaesti hidžretski mjesec?','Zul-hidže'],['Koji je sedmi hidžretski mjesec?','Redžeb'],['Koji je osmi hidžretski mjesec?','Ša’ban'],['Koji je deseti hidžretski mjesec?','Ševal'],['Šta znači da je kalendar lunarni?','Da se mjeseci određuju prema Mjesecu'],['Koliko mjeseci ima prvi dio spiska (od muharrema do džumadel-uhra)?','Šest'],['Ko je preselio tokom Hidžre?','Muhammed, a.s., i muslimani'],['Šta obilježavamo na početku muharrema?','Početak nove hidžretske godine']];
const stages=['NAUČI','SPOJI','SLOŽI REDOM','ŠTA NEDOSTAJE?','PREPOZNAJ PO ZNAČENJU','BRZI IZAZOV','ZAVRŠNI ISPIT'];
let stage=0,idx=0,points=0,learn=0,items=[],locked=false,chosen=null,matched=new Set(),left=[],right=[],remaining=[],timer=null;
const $=x=>document.getElementById(x);const sh=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function beep(ok){try{let C=window.AudioContext||window.webkitAudioContext,a=new C(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type=ok?'sine':'triangle';o.frequency.setValueAtTime(ok?660:230,a.currentTime);o.frequency.linearRampToValueAtTime(ok?850:140,a.currentTime+.17);g.gain.setValueAtTime(.09,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.24);o.start();o.stop(a.currentTime+.25);o.onended=()=>a.close()}catch(e){}}
function mark(ok){points+=ok?10:-3;$('score').textContent='Bodovi: '+points;$('feedback').textContent=ok?'✓ Tačno! +10':'✗ Netačno! −3';$('feedback').style.color=ok?'#91f5ae':'#ff9da6';beep(ok)}function bar(a,b){$('bar').style.width=Math.round(100*a/b)+'%'}function nav(){$('tabs').innerHTML=stages.map((s,i)=>`<button class="${stage===i?'on':''}" onclick="go(${i})">${i+1}. ${s}</button>`).join('')}
function go(n){clearTimeout(timer);stage=n;idx=0;learn=0;locked=false;chosen=null;matched=new Set();$('feedback').textContent='';nav();bar(0,1);if(n===0)study();else if(n===1)startPairs();else if(n===2)startOrder();else startQuiz()}
const cards=[['Šta je nova hidžretska godina?','Nova muslimanska godina počinje prvog dana mjeseca muharrema. Tog dana prisjećamo se Hidžre.'],['Šta je Hidžra?','Hidžra je preseljenje Muhammeda, alejhis-selam, i muslimana iz Mekke u Medinu. Dogodila se 622. godine.'],['Kako računamo godine?','Hidžretski kalendar računa godine od Hidžre. Ima dvanaest mjeseci i zasniva se na mjesečevim mijenama.'],['Koliko traje hidžretska godina?','Lunarna godina obično traje 354 ili 355 dana. Hidžretski dan počinje zalaskom Sunca.'],['Nauči svih 12 mjeseci',months.map((m,i)=>(i+1)+'. '+m).join('\n')],['Čestitka','MUBAREK NOVA HIDŽRETSKA GODINA!']];
function study(){bar(learn+1,cards.length);let c=cards[learn];$('view').innerHTML=`<h2>📖 NAUČI</h2><p class="small">Kartica ${learn+1} / ${cards.length}</p><div class="card"><h3>${esc(c[0])}</h3><p style="white-space:pre-line">${esc(c[1])}</p></div><div class="row"><button onclick="learn=Math.max(0,learn-1);study()">← Nazad</button><button onclick="learn<${cards.length-1}?(learn++,study()):go(1)">Dalje →</button></div>`}
function startPairs(){left=sh(months.map((m,i)=>({id:i,name:m,num:(i+1)+'. mjesec'})));right=sh(left);matched=new Set();chosen=null;drawPairs()}
function drawPairs(){bar(matched.size,12);$('view').innerHTML=`<h2>🧩 SPOJI</h2><p>Spoji naziv mjeseca s njegovim rednim mjestom.</p><div class="pair"><div>${left.map(p=>`<button ${matched.has(p.id)?'disabled':''} class="${matched.has(p.id)?'done':chosen===p.id?'picked':''}" onclick="chosen=${p.id};drawPairs()">${esc(p.name)}</button>`).join('')}</div><div>${right.map(p=>`<button ${matched.has(p.id)?'disabled':''} class="${matched.has(p.id)?'done':''}" onclick="pair(${p.id})">${p.num}</button>`).join('')}</div></div>${matched.size===12?'<h3>Bravo! Svih 12 mjeseci je spojeno.</h3><button onclick="go(2)">SLOŽI REDOM →</button>':''}`}
function pair(id){if(chosen===null)return;let ok=chosen===id;if(ok)matched.add(id);mark(ok);chosen=null;drawPairs()}
function startOrder(){remaining=sh(months.map((m,i)=>({id:i,name:m})));idx=0;drawOrder()}
function drawOrder(){bar(idx,12);$('view').innerHTML=`<h2>🔢 SLOŽI REDOM</h2><p>Pronađi mjesec koji dolazi sljedeći.</p><div class="card">${months.slice(0,idx).map((m,i)=>`<div>✓ ${i+1}. ${esc(m)}</div>`).join('')||'Počni od prvog mjeseca.'}</div>${remaining.map(p=>`<button class="answer" onclick="order(${p.id})">${esc(p.name)}</button>`).join('')}${idx===12?'<h3>Svih 12 mjeseci je složeno!</h3><button onclick="go(3)">ŠTA NEDOSTAJE? →</button>':''}`}
function order(id){let ok=id===idx;mark(ok);if(ok){remaining=remaining.filter(p=>p.id!==id);idx++}drawOrder()}
function question(q,a,wrong,kind){let opts=sh([...new Set([a,...wrong.filter(x=>x!==a)])]).slice(0,4);return{q,a,opts,kind}}
const distractors={
'Kako se zove muslimanska godina?':['Miladska godina','Sunčeva godina','Gregorijanska godina'],
'Kojeg dana počinje nova hidžretska godina?':['Prvog dana safera','Prvog dana redžeba','Prvog dana ramazana'],
'Kako se zove prvi hidžretski mjesec?':['Safer','Rebiul-evvel','Redžeb'],
'Koliko mjeseci ima hidžretska godina?':['Jedanaest','Deset','Trinaest'],
'Šta je Hidžra?':['Preseljenje muslimana iz Medine u Mekku','Preseljenje muslimana iz Mekke u Taif','Preseljenje muslimana iz Medine u Jerusalem'],
'Iz kojeg grada je izvršena Hidžra?':['Iz Medine','Iz Taifa','Iz Jerusalema'],
'U koji grad je izvršena Hidžra?':['U Mekku','U Taif','U Jerusalem'],
'Koje godine po gregorijanskom kalendaru se dogodila Hidžra?':['610. godine','620. godine','632. godine'],
'Po kojem događaju se računa hidžretski kalendar?':['Po rođenju Muhammeda, a.s.','Po početku objave Kur’ana','Po oslobođenju Mekke'],
'Kakva je hidžretska godina?':['Solarna (sunčeva)','Lunisolarna (mjesečevo-sunčeva)','Godina sa stalno 365 dana'],
'Koliko dana obično ima hidžretska godina?':['365 ili 366 dana','360 ili 361 dan','356 ili 357 dana'],
'Kada započinje dan u hidžretskom kalendaru?':['Izlaskom Sunca','U podne','U ponoć'],
'Kada se završava dan u hidžretskom kalendaru?':['Sljedećim izlaskom Sunca','Sljedećeg podneva','U ponoć'],
'Kako čestitamo novu hidžretsku godinu?':['Mubarek Ramazanski bajram!','Mubarek Kurban-bajram!','Mubarek Lejletul-kadr!'],
'Šta je muharrem u hidžretskom kalendaru?':['Drugi mjesec','Treći mjesec','Četvrti mjesec'],
'Koji je mjesec posta?':['Ša’ban','Ševal','Redžeb'],
'Koji je dvanaesti hidžretski mjesec?':['Zul-kade','Ševal','Ramazan'],
'Koji je sedmi hidžretski mjesec?':['Ša’ban','Džumadel-uhra','Ramazan'],
'Koji je osmi hidžretski mjesec?':['Redžeb','Ramazan','Ševal'],
'Koji je deseti hidžretski mjesec?':['Ramazan','Zul-kade','Ša’ban'],
'Šta znači da je kalendar lunarni?':['Da se mjeseci određuju prema položaju Sunca','Da se mjeseci određuju prema godišnjim dobima','Da se mjeseci određuju prema sedmicama'],
'Koliko mjeseci ima prvi dio spiska (od muharrema do džumadel-uhra)?':['Pet','Sedam','Osam'],
'Ko je preselio tokom Hidžre?':['Ibrahim, a.s., i njegova porodica','Musa, a.s., i njegov narod','Isa, a.s., i njegovi sljedbenici'],
'Šta obilježavamo na početku muharrema?':['Početak mjeseca ramazana','Početak hadžskih obreda','Početak nove miladske godine']
};
function nearby(i,exclude){let order=[i-1,i+1,i-2,i+2,i-3,i+3,i-4,i+4,i-5,i+5,i-6,i+6];return [...new Set(order.filter(j=>j>=0&&j<12&&j!==exclude).map(j=>months[j]))].slice(0,3)}
function nearbyNumbers(i){return [...new Set([i-1,i+1,i-2,i+2,i-3,i+3].filter(j=>j>=1&&j<=12&&j!==i).map(String))].slice(0,3)}
function bank(){let out=[];for(let i=0;i<12;i++){let m=months[i],n=String(i+1);out.push(question('Koji je '+(i+1)+'. hidžretski mjesec?',m,nearby(i,i),'meaning'));out.push(question('Koji redni broj ima mjesec '+m+'?',n,nearbyNumbers(i+1),'meaning'));if(i<11)out.push(question('Koji mjesec dolazi poslije '+m+'?',months[i+1],nearby(i+1,i+1),'order'));if(i>0)out.push(question('Koji mjesec dolazi prije '+m+'?',months[i-1],nearby(i-1,i-1),'order'));out.push(question('Koji mjesec nedostaje? '+(i>0?months[i-1]:'POČETAK')+' → ❓ → '+(i<11?months[i+1]:'KRAJ'),m,nearby(i,i),'missing'))}for(let i=0;i<facts.length;i++){let [q,a]=facts[i];out.push(question(q,a,distractors[q],'fact'))}return out}
function startQuiz(){let all=bank();if(stage===3)items=sh(all.filter(x=>x.kind==='missing'));else if(stage===4)items=sh(all.filter(x=>x.kind==='meaning'));else if(stage===5)items=sh(all).slice(0,20);else items=sh(all).slice(0,50);idx=0;drawQuiz()}
function drawQuiz(){if(idx>=items.length){bar(1,1);$('view').innerHTML=`<h2>🏆 ČESTITAMO!</h2><div class="card"><h3>${esc(stages[stage])} – završeno!</h3><p>Urađeno zadataka: ${items.length}</p><p>Ukupno bodova: ${points}</p></div><button onclick="go(${stage<6?stage+1:0})">${stage<6?'SLJEDEĆA ETAPA →':'PONOVI LEKCIJU ↻'}</button>`;return}let t=items[idx];bar(idx,items.length);$('view').innerHTML=`<h2>${esc(stages[stage])}</h2><p class="small">Zadatak ${idx+1} / ${items.length}</p><div class="card"><h3>${esc(t.q)}</h3></div>${t.opts.map((x,i)=>`<button id="ans${i}" class="answer" onclick="answer(${i})">${esc(x)}</button>`).join('')}`}
function answer(i){if(locked)return;locked=true;let t=items[idx],ok=t.opts[i]===t.a;mark(ok);t.opts.forEach((x,j)=>{let b=$('ans'+j);b.disabled=true;if(x===t.a)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});timer=setTimeout(()=>{idx++;locked=false;$('feedback').textContent='';drawQuiz()},900)}go(0);
</script></body></html>
